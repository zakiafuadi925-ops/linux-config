# ==========================================
# CYBERPUNK THEME SETTING FOR KITTY
# ==========================================

# Theming (Opsional: baris include bisa di-comment jika ingin memaksa palet cyberpunk ini mendominasi)
# include ~/.local/state/quickshell/user/generated/terminal/kitty-theme.conf

# Warna Font & Latar Belakang Utama (Deep Cyberpunk Night)
foreground              #f0f0f5
background              #0a0a12
selection_foreground    #05050a
selection_background    #00f0ff

# Font
font_family             JetBrains Mono Nerd Font
font_size 11.0

# Cursor (Menyala dengan Cyan Elektrik)
cursor_shape beam
cursor_trail 1
cursor                  #00f0ff
cursor_text_color       #05050a

# ------------------------------------------
# COLOR PALETTE (Standard 16 Cyberpunk Colors)
# ------------------------------------------
# Black & Dark Grays (Backgrounds/Muted)
color0 #121226
color8 #787899

# Red / Laser Error (#ff003c)
color1 #ff003c
color9 #ff003c

# Green / Phosphor Success (#39ff14)
color2 #39ff14
color10 #39ff14

# Yellow / Cyberpunk Warning (#fcee0a)
color3 #fcee0a
color11 #fcee0a

# Blue / Neon Cyan Primary (#00f0ff)
color4 #00f0ff
color12 #00f0ff

# Magenta / Neon Pink Accent (#ff00e5)
color5 #ff00e5
color13 #ff00e5

# Cyan / Secondary Neon (#7dcfff)
color6 #9d00ff
color14 #00f0ff

# White / Text Main (#f0f0f5)
color7 #f0f0f5
color15 #ffffff

# Padding 
window_margin_width 21.75

# No stupid close confirmation
confirm_os_window_close 0

# Use fish shell
shell fish

# Copy
map ctrl+c    copy_or_interrupt

# Search
map ctrl+f    launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f    launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# Scroll & Zoom
map page_up    scroll_page_up
map page_down    scroll_page_down

map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1
map ctrl+minus        change_font_size all -1
map ctrl+underscore        change_font_size all -1
map ctrl+kp_subtract        change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0

# Transparency & Blur
background_opacity 0.75

# Batas riwayat baris teks
scrollback_lines 20000
